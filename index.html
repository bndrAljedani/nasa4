<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrolytics: Flame in Freefall</title>
<meta name="description" content="Where fire has been tested in NASA's PSI combustion data, and where it has not. Earth, ISS and Moon base.">
<style>
:root{
  --bg:#EDF1F4; --panel:#FFFFFF; --ink:#0E1A2B; --ink2:#44556A; --ink3:#6B7B8E; --line:#D3DBE3; --line2:#E6EBF0;
  --navy:#0E1A2B; --accent:#0E1A2B;
  --out-went:#2B6CB0; --out-broke:#E0A100; --out-kept:#D23C2A; --out-no:#5A6B7D; --out-none:#98A4B1;
  --hd:"Bahnschrift","Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tx:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --hatch:repeating-linear-gradient(135deg,rgba(14,26,43,.0) 0 5px,rgba(14,26,43,.16) 5px 6px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--tx);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid #2B6CB0;outline-offset:2px;border-radius:4px}
.wrap{max-width:1380px;margin:0 auto;padding:0 20px}

/* header */
header.top{background:var(--navy);color:#fff}
.top .wrap{display:flex;align-items:center;gap:24px;min-height:58px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:700 21px/1 var(--hd);letter-spacing:.01em;text-decoration:none}
.brand small{font:400 12.5px var(--tx);color:#A9B8CA;letter-spacing:0;margin-left:2px}
nav{display:flex;gap:2px;margin-left:auto}
nav a{color:#C8D3E0;text-decoration:none;padding:19px 14px 15px;border-bottom:4px solid transparent;font-weight:600}
nav a:hover{color:#fff}
nav a[aria-current=page]{color:#fff;border-bottom-color:#fff}

/* layout */
main{padding:28px 20px 60px}
.page-head{margin:4px 0 16px;max-width:900px}
.page-head h1{font:700 34px/1.1 var(--hd);margin:0 0 6px;letter-spacing:.005em}
.page-head p{margin:0;color:var(--ink2);font-size:16px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card h2{font:700 19px/1.2 var(--hd);margin:0 0 4px}
.card .sub{color:var(--ink2);margin:0 0 12px;font-size:14px}
.sticky{position:sticky;top:12px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.fgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flabel{font-weight:700;font-size:13px;color:var(--ink2);margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px 4px 9px;font-size:13.5px;font-weight:600;color:var(--ink)}
.chip[aria-pressed=false]{color:var(--ink3);background:#F5F7F9;text-decoration:line-through;text-decoration-color:#9aa6b3}
.chip[aria-pressed=true]{border-color:var(--ink)}
.chip svg{flex:none}
.chip .n{font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums}
.btn{border:1.5px solid var(--ink);background:#fff;border-radius:8px;padding:5px 12px;font-weight:600;font-size:13.5px}
.btn:hover{background:var(--ink);color:#fff}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover{background:#26364d}
.search{border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;font:inherit;font-size:13.5px;width:150px}
.fnote{font-size:12.5px;color:var(--ink3);flex-basis:100%}

/* map */
.mapbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.mapbar .seg{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.mapbar .seg button{border:0;background:#fff;padding:5px 12px;font-weight:600;font-size:13.5px;border-right:1.5px solid var(--ink)}
.mapbar .seg button:last-child{border-right:0}
.mapbar .seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.mapwrap{position:relative}
svg.map{width:100%;height:auto;display:block;background:#fff;border-radius:6px;touch-action:manipulation}
svg.map text{font-family:var(--tx)}
.dot{cursor:pointer}
.dot:hover{stroke:var(--ink);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.hatchsw{width:18px;height:12px;border:1px solid var(--line);background:#fff var(--hatch)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:7px 10px;border-radius:7px;font-size:12.5px;line-height:1.4;max-width:260px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none}
.tip b{font-weight:700}
.breath{margin:12px 0 0;padding:10px 12px;background:#F4F7FA;border-left:4px solid var(--ink);border-radius:0 6px 6px 0;font-size:14px}

/* location cards on home */
.locs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.loc{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}
.loc:hover{border-color:var(--ink)}
.loc::after{content:"";position:absolute;right:0;top:0;bottom:0;width:46px;background:var(--hatch);opacity:.9}
.loc h3{font:700 20px var(--hd);margin:0}
.loc .cond{color:var(--ink2);font-size:13.5px;margin:2px 0 8px}
.loc .gapn{font:700 30px/1 var(--hd)}
.loc .gapt{font-size:13px;color:var(--ink2);max-width:80%}

/* gap panel */
.gap{background:var(--panel);border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.gap-head{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:flex-end;justify-content:space-between;padding:16px 20px 14px;background:var(--navy);color:#fff;position:relative}
.gap-head::after{content:"";position:absolute;right:0;top:0;bottom:0;width:38%;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.10) 6px 7px);pointer-events:none}
.gap-head h2{font:700 15px var(--hd);margin:0;letter-spacing:.04em;text-transform:none;color:#A9B8CA}
.gap-head .big{font:700 30px/1.1 var(--hd);margin:2px 0 0}
.gap-head .conds{display:flex;gap:18px;z-index:1}
.gap-head .conds div{font-size:12.5px;color:#A9B8CA}
.gap-head .conds b{display:block;font:700 22px/1.1 var(--hd);color:#fff}
.gap-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr)}
.gap-list li{padding:14px 20px;border-top:1px solid var(--line);border-right:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:start}
.gap-list li:nth-child(2n){border-right:0}
.badge{display:inline-block;font:700 12px/1 var(--hd);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px 4px;border-radius:4px;white-space:nowrap}
.badge.missing{background:var(--ink);color:#fff}
.badge.thin{border:1.5px solid var(--ink);background:#fff var(--hatch)}
.badge.covered{background:#E4EAF0;color:var(--ink)}
.gap-list .k{font-weight:700}
.gap-list .num{font:700 26px/1 var(--hd);grid-column:1;margin-top:6px}
.gap-list .txt{grid-column:2;margin:4px 0 0;font-size:14px;color:var(--ink2)}
.gap-list .row1{grid-column:1/3;display:flex;gap:10px;align-items:center}
.src{display:inline-block;font:12px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;color:var(--ink2);text-decoration:none;background:#F7F9FB}
.src:hover{border-color:var(--ink)}
.gap-foot{padding:10px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2);background:#F7F9FB;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.means{background:#fff;border:1px solid var(--line);border-left:5px solid var(--ink);border-radius:6px;padding:14px 18px}
.means h2{font:700 17px var(--hd);margin:0 0 4px}
.means p{margin:0;font-size:15.5px;max-width:78ch}

/* bars */
.bandrow{display:grid;grid-template-columns:78px 1fr 48px;gap:10px;align-items:center;margin:7px 0;font-size:13.5px}
.bandrow.hl{background:linear-gradient(90deg,#EEF3F8,transparent);border-radius:6px;outline:2px solid var(--ink);outline-offset:3px}
.stack{display:flex;height:22px;gap:2px;border-radius:3px;overflow:hidden;background:#EEF1F4}
.stack i{display:block;height:100%}
.bandrow .n{text-align:right;color:var(--ink3);font-variant-numeric:tabular-nums}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:700;color:var(--ink2);border-bottom:2px solid var(--ink);padding:6px 8px;position:sticky;top:0;background:#fff;white-space:nowrap}
.tbl th button{border:0;background:none;font-weight:700;color:inherit;padding:0}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:#F2F6FA}
.tbl tr.sel td{background:#E3ECF5}
.tbl .idbtn{border:0;background:none;padding:0;font:600 13px var(--mono);text-decoration:underline;text-underline-offset:3px}
.tscroll{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.dotsw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.num{font-variant-numeric:tabular-nums}

/* inspector */
.insp h2{font:700 19px var(--hd);margin:0}
.insp .empty{color:var(--ink2);padding:6px 0}
.insp .empty .ghost{height:90px;border:1.5px dashed var(--line);border-radius:8px;background:#fff var(--hatch);margin:10px 0}
.insp .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.insp .tid{font:700 22px/1.15 var(--hd);word-break:break-word}
.insp .what{color:var(--ink2);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;margin-top:8px}
.kv{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.kv td{padding:5px 0;border-bottom:1px solid var(--line2);vertical-align:top}
.kv td:first-child{color:var(--ink2);width:46%;padding-right:8px}
.kv td:last-child{font-weight:600}
.kv .u{font-weight:400;color:var(--ink2)}
.kv .nt{display:block;font-weight:400;font-size:12px;color:var(--ink3)}
.nr{color:var(--ink3);font-weight:400;font-style:italic}
.insp h3{font:700 15px var(--hd);margin:16px 0 2px;letter-spacing:.02em}
.trace{background:#F4F7FA;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:6px}
.trace .kv td{border-bottom-color:#E1E7ED}
.trace code{font:12.5px var(--mono);word-break:break-all}
.warn{background:#FFF8E1;border:1px solid #EBD28A;border-radius:6px;padding:7px 10px;font-size:13px;margin:6px 0 0}
details summary{cursor:pointer;font-weight:600;font-size:13.5px;margin-top:8px}
.raw{font:12px var(--mono);overflow:auto;max-height:200px;border:1px solid var(--line);border-radius:6px;margin-top:6px}
.raw td{padding:2px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.close{border:0;background:none;font-size:22px;line-height:1;padding:2px 6px}
.sheetclose{display:none}

/* sources */
.srcgrid td,.srcgrid th{padding:7px 8px}
.logitem{padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px}
.logitem b{font-family:var(--mono);font-size:13px}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:3px 0}
.mapdef td{padding:5px 10px 5px 0;vertical-align:top;font-size:14px}

footer{color:var(--ink3);font-size:12.5px;padding:0 0 30px}

/* home intro */
.hero{max-width:900px;margin:0 0 14px}
.hero h1{font:700 40px/1.06 var(--hd);margin:0 0 8px;letter-spacing:.003em}
.hero p{font-size:17.5px;color:var(--ink2);margin:0;max-width:70ch}
.intro2{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;margin-bottom:14px}
.intro2 .card p{margin:0 0 8px;font-size:15.5px}
.intro2 .card p:last-child{margin:0}
.steps{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:15.5px}
.stepn{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font:700 15px/28px var(--hd);text-align:center}
.tlcard{margin-bottom:12px}
.tl{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.tl::before{content:"";position:absolute;left:0;right:0;top:8px;height:3px;background:var(--ink)}
.tl li{position:relative;padding:28px 16px 0 0;font-size:14.5px;line-height:1.4}
.tl li::before{content:"";position:absolute;top:0;left:0;width:19px;height:19px;border-radius:50%;background:#fff;border:4px solid var(--ink)}
.tl .yr{display:block;font:700 16px var(--hd);margin-bottom:3px}
.aiuse{font-size:13px;color:var(--ink2);max-width:100ch;margin:0 0 6px}
.sechead{font:700 24px var(--hd);margin:20px 0 10px}

/* investigation cards */
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.pillars.sup{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pcol h3{font:700 17px var(--hd);margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.pcol h3 small{display:block;font:400 12.5px var(--tx);color:var(--ink2)}
.inv{border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:10px;background:#fff}
.inv h4{font:700 17px var(--hd);margin:0 8px 3px 0;display:inline-block}
.invh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.score{font:700 13px var(--hd);color:var(--ink2);white-space:nowrap}
.score b{font-size:26px;color:var(--ink);line-height:1}
.chk{display:inline-block;margin:4px 0 0;font:700 12px var(--tx);background:#E7F3EC;border:1px solid #9CCAB0;color:#17552F;border-radius:4px;padding:1px 6px}
.inv .sm{margin:6px 0 0;font-size:13.5px;line-height:1.4}
.inv .sm b{font-weight:700;margin-right:4px}
.inv .use{margin:6px 0 0;font-size:13px;color:var(--ink2)}
.bd{display:grid;grid-template-columns:auto auto 1fr;gap:3px 8px;align-items:center;margin-top:8px;font-size:12px;color:var(--ink2)}
.bd .pp{display:flex;gap:3px}
.pip{width:14px;height:8px;border-radius:2px;background:#E1E7ED;display:inline-block}
.pip.on{background:var(--ink)}
.bd .nn{font-variant-numeric:tabular-nums}
.inv .why{margin:7px 0 0;font-size:12px;color:var(--ink3)}
.plink{display:inline-block;margin-top:6px;font-size:13px;font-weight:600}
details.how,details.more{margin:6px 0 12px}
details.how p,details.how li{font-size:13.5px}
.sup-summary{font-weight:700}

/* custom habitat */
.presets{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
.sliders{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.sl label{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.sl output{font-weight:600;color:#5B2A99}
.sl input[type=range]{width:100%;accent-color:#7B3FBF;margin:6px 0 0}
.rng{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3)}
.breath2{margin-top:12px;padding:10px 12px;background:#F4F7FA;border-left:4px solid #7B3FBF;border-radius:0 6px 6px 0;font-size:14.5px}
.breath2 .u{color:var(--ink2)}
.meter{position:relative;height:10px;background:#E1E7ED;border-radius:5px;margin-top:8px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:#7B3FBF;border-radius:5px}
.meter u{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--ink);text-decoration:none}
.nonear{background:#FFF8E1;border:2px solid var(--ink);border-radius:8px;padding:12px 16px;font-size:15px}

@media (max-width:900px){
  .pillars{grid-template-columns:1fr}
  .intro2{grid-template-columns:1fr}
  .sliders{grid-template-columns:1fr}
  .tl{grid-template-columns:1fr}
  .tl::before{left:8px;right:auto;top:0;bottom:0;width:3px;height:auto}
  .tl li{padding:0 0 16px 32px}
  .hero h1{font-size:30px}
}

@media (max-width:1100px){
  .grid{grid-template-columns:1fr}
  .sticky{position:static}
  .insp-col{order:-1}
  body.has-sel .insp-card{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:62vh;overflow:auto;border-radius:14px 14px 0 0;border-width:2px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
  .sheetclose{display:inline-block}
  .insp-col .insp-card.nosel{display:none}
}
@media (max-width:760px){
  .gap-list{grid-template-columns:1fr}
  .gap-list li{border-right:0}
  .locs{grid-template-columns:1fr}
  .page-head h1{font-size:28px}
  nav a{padding:12px 9px 10px;font-size:14px}
  .gap-head .big{font-size:25px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{header.top nav,.filters,.mapbar{display:none}}
</style>
</head>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#/home" aria-label="Astrolytics home">
      <svg width="22" height="26" viewBox="0 0 22 26" aria-hidden="true"><path d="M11 1c1 5 7 8 7 15a7 7 0 0 1-14 0c0-3 1.5-4.500 3-6 .2 2 1 3 2 3.500C9 9 9.500 5 11 1z" fill="#fff"/><path d="M11 24a3.500 3.500 0 0 1-3.500-3.500c0-2 1.600-2.800 2.400-4.500.8 1 1.200 1.600 1.200 1.600.6-.7 1-1.500 1-2.600 1.700 1.400 2.400 3 2.400 5.500A3.500 3.500 0 0 1 11 24z" fill="#0E1A2B"/></svg>
      Astrolytics <small>Flame in Freefall</small>
    </a>
    <nav aria-label="Pages" id="nav">
      <a href="#/home" data-p="home">Fire Map</a>
      <a href="#/earth" data-p="earth">Earth</a>
      <a href="#/iss" data-p="iss">ISS</a>
      <a href="#/moon" data-p="moon">Moon base</a>
      <a href="#/custom" data-p="custom">Custom habitat</a>
      <a href="#/sources" data-p="sources">Sources &amp; cleaning</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>

-99","Saffire-II","Prevention","9 samples","10.60555/2chp-m469","Mapped, grey"],["PSI-100","Saffire-III","Prevention","2 burns","10.60555/040q-4h36","Not mapped: no oxygen value"],["PSI-26","BASS","Prevention, suppression","121-row log","10.60555/58h4-dy80","Not mapped: test log only"],["PSI-20","ACME BRE","Prevention","18 test days","10.60555/vb93-3y72","Text only: pressure not recorded"],["PSI-102","SAME","Detection","8 rows","10.60555/gd4k-8h62","Not mapped"],["PSI-101","SAME-R","Detection","109 rows","","Not mapped"],["PSI-47","DAFT","Detection","2 sessions","10.60555/ztgj-d202","Not mapped"],["PSI-68","FLEX-2","Indirect","8 plan rows","10.60555/byp8-h018","Plan only, no results"],["PSI-39","CFI","Indirect","79 tests","","No outcome column"],["PSI-107","SPICE","Indirect (soot)","469 rows","","Not mapped"],["PSI-106","SLICE","Indirect","12 days","10.60555/pm12-rg61","Not mapped"],["PSI-22","ACME E-FIELD","Partial-g stand-in","21 test days","10.60555/se5a-8c73","Not mapped (daily counts left out)"],["PSI-23","ACME s-Flame","Indirect","18 test days","","Not mapped (daily counts left out)"],["PSI-21","ACME CLD Flame","Indirect","32 test days","10.60555/23e1-9950","Not mapped (daily counts left out)"],["PSI-10","ACME Flame Design","Indirect","207 normal + 120 inverse","","Conditions only, no outcome"],["PSI-142","Cool-flame counterflow","Ground study","8 references","10.60555/80qf-vj95","Not mapped"]]};

<script>
"use strict";
const T = DATA.tests;
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, d=1) => v == null ? null : (Math.round(v * 10**d) / 10**d).toLocaleString('en-US', {maximumFractionDigits: d});
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : 'n/a';

/* ---------- vocab ---------- */
const OUT = {
  went_out:    {label:'Went out',            color:'#2B6CB0', def:'FLEX: test ended in extinction. CFI-G: flame self-extinguished (SE).'},
  broke_apart: {label:'Broke apart',         color:'#E0A100', def:'FLEX: test ended in disruption (the droplet was disrupted).'},
  kept_burning:{label:'Kept burning',        color:'#D23C2A', def:'FLEX: burned to completion. CFI-G: flow was cut while it still burned (FT), so it may have burned longer.'},
  no_ignition: {label:'Did not ignite',      color:'#5A6B7D', def:'CFI-G only: no hot ignition recorded.'},
  none:        {label:'No outcome column',   color:'#98A4B1', def:'BASS-II and Saffire tables do not hold a result column that was scored here. Raw text is shown in the inspector.'}
};
const STUDY = {
  'FLEX':   {label:'FLEX',      psi:'PSI-69',  shape:'circle',  what:'droplet flames'},
  'CFI-G':  {label:'CFI-G',     psi:'PSI-159', shape:'diamond', what:'gas flames, normal'},
  'BASS-II':{label:'BASS-II',   psi:'PSI-25',  shape:'tri',     what:'real materials'},
  'Saffire':{label:'Saffire I–II', psi:'PSI-98/99', shape:'tri', what:'real materials'}
};
const PSI = {
 'PSI-69':{name:'FLEX', doi:'10.60555/mbq8-0451'}, 'PSI-159':{name:'ACME CFI-G', doi:''}, 'PSI-25':{name:'BASS-II', doi:''},
 'PSI-98':{name:'Saffire-I', doi:'10.60555/0t15-1z43'}, 'PSI-99':{name:'Saffire-II', doi:'10.60555/2chp-m469'}, 'PSI-20':{name:'ACME BRE', doi:'10.60555/vb93-3y72'}
};
const psiUrl = id => 'https://psi.nasa.gov/physci/repo/data/investigations/' + id;
const srcChip = id => `<a class="src" href="${psiUrl(id)}" target="_blank" rel="noopener" title="Open ${id} on psi.nasa.gov">${id}</a>`;

const boxOf = h => ({o2:[h.o2 - 4, h.o2 + 4], p:[h.p - 1.5, h.p + 1.5]});
const LOC = {
  earth:{key:'earth', name:'Earth', o2:21, p:14.7, g:1, gl:'1 g', dom:{x:[10,20], y:[14,28]}, intro:"Sea-level air and normal gravity. What does NASA's flame data say, and what is missing?"},
  iss:  {key:'iss', name:'ISS', o2:21, p:14.7, g:0, gl:'≈0 g', dom:{x:[10,20], y:[14,28]}, intro:'Station air in orbit. Almost all of the flame data in PSI was made here.'},
  moon: {key:'moon', name:'Moon base', sub:'and pressurised rovers', o2:30, p:10.2, g:1/6, gl:'⅙ g', dom:{x:[5,16], y:[24,42]}, intro:'Planned Moon habitats and rovers run at 30% oxygen or more and 10.2 psi or less. How much of that has been tested?'},
  custom:{key:'custom', name:'Custom habitat', o2:30, p:10.2, g:0.17, dom:{x:[5,16], y:[24,42]}, intro:'Set your own oxygen, pressure and gravity. The Fire Map star, gap panel, investigation cards and nearest tests all update as you move the sliders.'}
};
Object.values(LOC).forEach(L => L.box = boxOf(L));
function domFor(key){
  if(key === 'whole') return WHOLE;
  if(key === 'custom'){ const C = LOC.custom, x0 = Math.max(0, C.p - 5), y0 = Math.max(WHOLE.y[0], C.o2 - 8); return {x:[x0, x0 + 10], y:[y0, y0 + 16]}; }
  return LOC[key].dom;
}
const WHOLE = {x:[0,46], y:[10,42]};

/* ---------- state ---------- */
const S = { studies:new Set(Object.keys(STUDY)), outs:new Set(Object.keys(OUT)), q:'', sel:null, dom:{x:[...WHOLE.x], y:[...WHOLE.y]}, sort:{k:'o2', dir:1}, shown:40, zoomKey:'whole', customOn:false };
const byId = Object.fromEntries(T.map(t => [t.id, t]));
const isFlame = t => t.study === 'FLEX' || t.study === 'CFI-G';
const FLAME = T.filter(isFlame);

function passes(t){
  if(!S.studies.has(t.study) || !S.outs.has(t.out)) return false;
  if(S.q){ const q = S.q.toLowerCase(); if(!(`${t.id} ${t.tid} ${t.what} ${t.psi}`.toLowerCase().includes(q))) return false; }
  return true;
}
const filtered = () => T.filter(passes);
const inBox = (t, b) => t.p != null && t.o2 != null && t.o2 >= b.o2[0] && t.o2 <= b.o2[1] && t.p >= b.p[0] && t.p <= b.p[1];
const mix = arr => { const m = {}; arr.forEach(t => m[t.out] = (m[t.out]||0)+1); return m; };

/* deterministic pixel jitter so stacked tests are visible */
function jit(id, axis){ let h = 2166136261; const s = id + axis; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h>>>0) % 1000) / 1000 - .5; }

/* ---------- coverage (what has never been tested), independent of filters ---------- */
const CELL = {p:2, o:2};
const tested = new Set(FLAME.filter(t => t.p != null).map(t => Math.floor(t.p/CELL.p) + ',' + Math.floor(t.o2/CELL.o)));

/* ---------- Fire Map ---------- */
const MW = 900, MH = 560, ML = 58, MR = 18, MT = 14, MB = 52;
function sx(v){ return ML + (v - S.dom.x[0]) / (S.dom.x[1] - S.dom.x[0]) * (MW - ML - MR); }
function sy(v){ return MH - MB - (v - S.dom.y[0]) / (S.dom.y[1] - S.dom.y[0]) * (MH - MB - MT); }
function niceStep(range, n){ const raw = range / n, p = 10 ** Math.floor(Math.log10(raw)); const m = raw / p; return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p; }
function marker(t, x, y, sel){
  x = +x; y = +y;
  const o = OUT[t.out], sh = STUDY[t.study].shape;
  const hollow = t.out === 'no_ignition';
  const fill = hollow ? '#fff' : o.color, stroke = hollow ? o.color : '#fff', sw = hollow ? 2 : 1.2;
  const common = `class="dot" data-id="${t.id}" fill="${fill}" stroke="${sel ? '#0E1A2B' : stroke}" stroke-width="${sel ? 3 : sw}" fill-opacity="${t.out==='none'?.75:.9}"`;
  const r = sel ? 7.5 : 5.5;
  if(sh === 'circle') return `<circle ${common} cx="${x}" cy="${y}" r="${r}"/>`;
  if(sh === 'diamond') return `<path ${common} d="M${x},${y-r-1.5} L${x+r+1.5},${y} L${x},${y+r+1.5} L${x-r-1.5},${y}Z"/>`;
  return `<path ${common} d="M${x},${y-r-1} L${x+r+1},${y+r-1} L${x-r-1},${y+r-1}Z"/>`;
}
function renderMap(){
  const svg = $('#map'); if(!svg) return;
  const [x0,x1] = S.dom.x, [y0,y1] = S.dom.y;
  let h = `<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0E1A2B" stroke-opacity=".17" stroke-width="1.6"/></pattern>
  <clipPath id="clip"><rect x="${ML}" y="${MT}" width="${MW-ML-MR}" height="${MH-MT-MB}"/></clipPath></defs>`;
  // untested cells
  h += `<g clip-path="url(#clip)">`;
  for(let pi = Math.floor(Math.max(0,x0)/CELL.p); pi*CELL.p < Math.min(x1, WHOLE.x[1]); pi++)
    for(let oi = Math.floor(Math.max(WHOLE.y[0],y0)/CELL.o); oi*CELL.o < Math.min(y1, WHOLE.y[1]); oi++){
      if(tested.has(pi+','+oi)) continue;
      const xa = sx(pi*CELL.p), xb = sx((pi+1)*CELL.p), ya = sy((oi+1)*CELL.o), yb = sy(oi*CELL.o);
      h += `<rect x="${xa}" y="${ya}" width="${xb-xa}" height="${yb-ya}" fill="url(#hatch)"/>`;
    }
  h += `</g>`;
  // grid + axes
  const xs = niceStep(x1-x0, 8), ys = niceStep(y1-y0, 7);
  for(let v = Math.ceil(x0/xs)*xs; v <= x1+1e-9; v += xs) h += `<line x1="${sx(v)}" x2="${sx(v)}" y1="${MT}" y2="${MH-MB}" stroke="#0E1A2B" stroke-opacity=".08"/><text x="${sx(v)}" y="${MH-MB+18}" text-anchor="middle" font-size="12" fill="#44556A">${fmt(v,1)}</text>`;
  for(let v = Math.ceil(y0/ys)*ys; v <= y1+1e-9; v += ys) h += `<line y1="${sy(v)}" y2="${sy(v)}" x1="${ML}" x2="${MW-MR}" stroke="#0E1A2B" stroke-opacity=".08"/><text x="${ML-8}" y="${sy(v)+4}" text-anchor="end" font-size="12" fill="#44556A">${fmt(v,1)}%</text>`;
  h += `<rect x="${ML}" y="${MT}" width="${MW-ML-MR}" height="${MH-MT-MB}" fill="none" stroke="#0E1A2B" stroke-opacity=".35"/>`;
  h += `<text x="${(ML+MW-MR)/2}" y="${MH-12}" text-anchor="middle" font-size="13" font-weight="600" fill="#0E1A2B">Cabin pressure (psi)</text>`;
  h += `<text transform="translate(15 ${(MT+MH-MB)/2}) rotate(-90)" text-anchor="middle" font-size="13" font-weight="600" fill="#0E1A2B">Oxygen in the air (%)</text>`;
  // same-oxygen-to-breathe curve (3.09 psi of O2)
  const PP = 0.21 * 14.7; let d = '', first = true;
  for(let i=0;i<=120;i++){ const p = x0 + (x1-x0)*i/120; if(p <= 0) continue; const o = PP / p * 100; if(o > y1+3 || o < y0-3) continue; d += (first ? 'M' : 'L') + sx(p).toFixed(1) + ',' + sy(o).toFixed(1); first = false; }
  h += `<g clip-path="url(#clip)"><path d="${d}" fill="none" stroke="#0E1A2B" stroke-width="1.6" stroke-dasharray="6 5" opacity=".75"/></g>`;
  // dots
  const list = filtered().filter(t => t.p != null && t.o2 != null);
  h += `<g clip-path="url(#clip)">`;
  list.filter(t => t.id !== S.sel).forEach(t => { h += marker(t, (sx(t.p) + jit(t.id,'x')*9).toFixed(1), (sy(t.o2) + jit(t.id,'y')*9).toFixed(1), false); });
  const st = S.sel && byId[S.sel]; if(st && st.p != null && passes(st)) h += marker(st, (sx(st.p) + jit(st.id,'x')*9).toFixed(1), (sy(st.o2) + jit(st.id,'y')*9).toFixed(1), true);
  h += `</g>`;
  // location stars
  const stars = [['earth','Earth & ISS',LOC.earth, 'start'], ['moon','Moon base',LOC.moon,'start']];
  stars.forEach(([k,label,L]) => {
    const x = sx(L.p), y = sy(L.o2); if(x < ML || x > MW-MR || y < MT || y > MH-MB) return;
    h += `<g class="star" data-loc="${k}" tabindex="0" role="button" aria-label="Zoom to ${label}" style="cursor:pointer"><path style="pointer-events:none" transform="translate(${x} ${y})" d="M0,-13 L3.800,-4.200 L13,-4 L5.800,2.200 L8,11 L0,6 L-8,11 L-5.800,2.200 L-13,-4 L-3.800,-4.200Z" fill="#fff" stroke="#0E1A2B" stroke-width="2.500" stroke-linejoin="round"/>
      <text x="${x+17}" y="${y-8}" font-size="13" font-weight="700" fill="#0E1A2B" paint-order="stroke" stroke="#fff" stroke-width="4">${label}</text>
      <text x="${x+17}" y="${y+7}" font-size="11.500" fill="#44556A" paint-order="stroke" stroke="#fff" stroke-width="4">${L.o2}% · ${L.p} psi</text></g>`;
  });
  if(S.customOn){
    const C = LOC.custom, x = sx(C.p), y = sy(C.o2);
    if(x >= ML && x <= MW-MR && y >= MT && y <= MH-MB){
      const flip = x > MW - 190, tx = flip ? x - 17 : x + 17, an = flip ? 'end' : 'start';
      h += `<g class="star" data-loc="custom" tabindex="0" role="button" aria-label="Zoom to your habitat" style="cursor:pointer"><path style="pointer-events:none" transform="translate(${x} ${y})" d="${STARPATH}" fill="#7B3FBF" stroke="#0E1A2B" stroke-width="2.500" stroke-linejoin="round"/>
      <text x="${tx}" y="${y+22}" text-anchor="${an}" font-size="13" font-weight="700" fill="#5B2A99" paint-order="stroke" stroke="#fff" stroke-width="4">Your habitat</text>
      <text x="${tx}" y="${y+37}" text-anchor="${an}" font-size="11.500" fill="#44556A" paint-order="stroke" stroke="#fff" stroke-width="4">${fmt(C.o2,1)}% · ${fmt(C.p,1)} psi</text></g>`;
    }
  }
  // annotation on the dashed line
  const ax = Math.min(x1, Math.max(x0, x0 + (x1-x0)*.72)), ao = PP/ax*100;
  if(ao > y0 && ao < y1) h += `<text x="${sx(ax)}" y="${sy(ao)-9}" font-size="11.500" fill="#0E1A2B" paint-order="stroke" stroke="#fff" stroke-width="4">Same oxygen to breathe (3.1 psi)</text>`;
  svg.innerHTML = h;
}
function tween(to, ms=420){
  const from = {x:[...S.dom.x], y:[...S.dom.y]};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ S.dom = {x:[...to.x], y:[...to.y]}; renderMap(); return; }
  const t0 = performance.now();
  (function step(now){
    const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    S.dom = {x:[from.x[0]+(to.x[0]-from.x[0])*e, from.x[1]+(to.x[1]-from.x[1])*e], y:[from.y[0]+(to.y[0]-from.y[0])*e, from.y[1]+(to.y[1]-from.y[1])*e]};
    renderMap(); if(k < 1) requestAnimationFrame(step);
  })(t0);
}
function zoomTo(key){
  S.zoomKey = key;
  tween(domFor(key));
  document.querySelectorAll('.mapbar .seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.z === key));
}

/* band chart: outcome by oxygen level */
const BANDS = [[12,15.99,'12–15%'],[16,20.99,'16–20%'],[21,25.99,'21–25%'],[26,29.99,'26–29%'],[30,34.99,'30–34%'],[35,40.99,'35–40%']];
function bandChart(hlRange){
  const arr = filtered().filter(t => isFlame(t));
  const empty = !arr.length;
  const rows = BANDS.map(([a,b,l]) => {
    const sub = arr.filter(t => t.o2 >= a && t.o2 <= b), m = mix(sub), n = sub.length;
    const hl = hlRange && hlRange[0] <= b && hlRange[1] >= a;
    const segs = ['went_out','broke_apart','kept_burning','no_ignition'].map(k => m[k] ? `<i style="width:${100*m[k]/n}%;background:${k==='no_ignition'?'#5A6B7D':OUT[k].color}" title="${OUT[k].label}: ${m[k]} of ${n}"></i>` : '').join('');
    return `<div class="bandrow${hl?' hl':''}"><span>${l} O₂</span><div class="stack" role="img" aria-label="${l}: ${n?Object.entries(m).map(([k,v])=>OUT[k].label+' '+v).join(', '):'no tests'}">${n?segs:''}</div><span class="n">${n} test${n===1?'':'s'}</span></div>`;
  }).join('');
  return `<div>${empty?'<p class="sub">No flame tests match the filters.</p>':rows}
  <div class="legend" style="margin-top:8px">${['went_out','broke_apart','kept_burning','no_ignition'].map(k => `<span><i class="dotsw" style="background:${OUT[k].color}"></i>${OUT[k].label}</span>`).join('')}</div></div>`;
}

/* test table */
function testTable(list, opts={}){
  const k = S.sort.k, dir = S.sort.dir;
  const val = t => k === 'id' ? t.id : k === 'o2' ? (t.o2 ?? -1) : k === 'p' ? (t.p ?? -1) : OUT[t.out].label;
  const sorted = [...list].sort((a,b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
  const shown = sorted.slice(0, opts.limit || S.shown);
  const th = (key, l) => `<th><button data-sort="${key}" title="Sort by ${l}">${l}${S.sort.k===key ? (S.sort.dir>0?' ▲':' ▼') : ''}</button></th>`;
  return `<div class="tscroll"><table class="tbl"><thead><tr>${th('id','Test')}<th>Study</th>${th('o2','O₂ %')}${th('p','Pressure psi')}${th('out','Outcome')}</tr></thead><tbody>${shown.map(t => `<tr class="row${S.sel===t.id?' sel':''}" data-id="${t.id}"><td><button class="idbtn" data-pick="${t.id}">${esc(t.id)}</button></td><td>${STUDY[t.study].label}</td><td class="num">${t.o2 != null ? fmt(t.o2) : '<span class="nr">no value</span>'}</td><td class="num">${t.p != null ? fmt(t.p) + (t.pnom ? '*' : '') : '<span class="nr">no value</span>'}</td><td><i class="dotsw" style="background:${OUT[t.out].color}"></i>${OUT[t.out].label}</td></tr>`).join('')}</tbody></table></div>
  <p class="sub" style="margin:8px 0 0">Showing ${shown.length} of ${list.length}. ${list.some(t=>t.pnom)?'* Pressure not recorded; nominal 14.7 psi cabin pressure. ':''}${shown.length < list.length && !opts.limit ? '<button class="btn" id="more">Show 40 more</button>' : ''}</p>`;
}
function bindTable(root){
  root.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { const k = b.dataset.sort; S.sort = {k, dir: S.sort.k === k ? -S.sort.dir : 1}; refresh(true); });
  root.querySelectorAll('tr.row').forEach(r => r.onclick = () => select(r.dataset.id));
  const m = root.querySelector('#more'); if(m) m.onclick = () => { S.shown += 40; refresh(true); };
}

/* ---------- inspector (select a test, trace to PSI) ---------- */

  const t = S.sel && byId[S.sel];

  const o = OUT[t.out], info = PSI[t.psi] || {};
  const fieldsHtml = t.fields.map(([k,v,u,n]) => `<tr><td>${esc(k)}</td><td>${(v === null || v === '' || v === undefined) ? '<span class="nr">no value recorded</span>' : esc(v) + (u ? ' <span class="u">' + esc(u) + '</span>' : '')}${n ? `<span class="nt">${esc(n)}</span>` : ''}</td></tr>`).join('');
  const doi = info.doi ? `<a href="https://doi.org/${info.doi}" target="_blank" rel="noopener">${info.doi}</a>` : '<span class="nr">on its PSI page; not listed in the guide</span>';
  const raw = Object.entries(t.raw).map(([k,v]) => `<tr><td>${esc(k)}</td><td>${esc(v) || '<span class="nr">(blank)</span>'}</td></tr>`).join('');
  return `<div class="insp-card card"><div class="insp">
    <div class="head"><div><h2>Test inspector</h2></div><button class="close" id="unsel" aria-label="Close inspector">×</button></div>
    <div class="tid" style="margin-top:8px">${esc(t.id)}</div>
    <div class="what">${esc(STUDY[t.study].label)} · ${esc(t.what)}</div>
    <div class="pill"><i class="dotsw" style="background:${o.color};margin:0"></i>${o.label}</div>
    <div class="what" style="margin-top:4px">${esc(t.native)}</div>
    ${t.notes.map(n => `<div class="warn">${esc(n)}</div>`).join('')}
    <h3>Measurements</h3>
    <table class="kv">${fieldsHtml}</table>
    <h3>Trace to PSI source</h3>
    <div class="trace"><table class="kv">
      <tr><td>Investigation</td><td>${t.psi} ${esc(info.name || '')} · <a href="${psiUrl(t.psi.split('/')[0])}" target="_blank" rel="noopener">psi.nasa.gov</a></td></tr>
      <tr><td>Experimental table</td><td><code>${esc(t.file)}</code></td></tr>
      <tr><td>Row in that file</td><td>line ${t.row} (header is line 1)</td></tr>
      <tr><td>ID in the table</td><td><code>${esc(t.tid)}</code>${t.date ? ' · ' + esc(t.date) : ''}</td></tr>
      <tr><td>DOI</td><td>${doi}</td></tr></table>
      <details><summary>Original row, exactly as in the CSV</summary><div class="raw"><table>${raw}</table></div></details>
      <button class="btn" id="cite" style="margin-top:8px">Copy citation</button></div>
  </div></div>`;
}
function select(id){
  S.sel = id; document.body.classList.add('has-sel');
  renderInspector(); renderMap();
  document.querySelectorAll('tr.row').forEach(r => r.classList.toggle('sel', r.dataset.id === id));
}
function renderInspector(){
  const host = $('#insp'); if(!host) return;
  host.innerHTML = inspectorHtml();
  const u = $('#unsel'); if(u) u.onclick = () => { S.sel = null; document.body.classList.remove('has-sel'); renderInspector(); renderMap(); document.querySelectorAll('tr.row.sel').forEach(r => r.classList.remove('sel')); };
  const c = $('#cite'); if(c) c.onclick = () => { const t = byId[S.sel]; const txt = `NASA PSI ${t.psi} ${PSI[t.psi]?.name||''}, experimental table "${t.file}", line ${t.row}, test ${t.tid}. Retrieved via psi.nasa.gov, read 13 November 2026.${PSI[t.psi]?.doi ? ' doi:' + PSI[t.psi].doi : ''}`; navigator.clipboard?.writeText(txt).then(() => { c.textContent = 'Copied'; setTimeout(() => c.textContent = 'Copy citation', 1500); }).catch(() => { c.textContent = txt; }); };
}

/* ---------- tooltip ---------- */
function bindMapEvents(){
  const svg = $('#map'), tip = $('#tip'), wrap = $('.mapwrap'); if(!svg) return;
  svg.onmousemove = e => {
    const el = e.target.closest('.dot'); if(!el){ tip.style.display = 'none'; return; }
    const t = byId[el.dataset.id], r = wrap.getBoundingClientRect();
    tip.innerHTML = `<b>${esc(t.id)}</b> · ${STUDY[t.study].label}<br>${esc(t.what)}<br>${fmt(t.o2)}% O₂ · ${fmt(t.p)} psi${t.pnom?' (nominal)':''}<br>${OUT[t.out].label}<br><span style="color:#A9B8CA">Click to inspect</span>`;
    tip.style.display = 'block';
    const x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
    tip.style.left = Math.min(x, r.width - 270) + 'px'; tip.style.top = y + 'px';
  };
  svg.onmouseleave = () => tip.style.display = 'none';
  svg.onclick = e => {
    const d = e.target.closest('.dot'); if(d){ select(d.dataset.id); return; }
    const s = e.target.closest('.star'); if(s) zoomTo(s.dataset.loc);
  };
  svg.onkeydown = e => { const s = e.target.closest?.('.star'); if(s && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); zoomTo(s.dataset.loc); } };
}

const PILLARS = [['Prevention','Will it burn?'],['Detection','Can we sense it?'],['Suppression','Can we put it out?']];
const DATAWHY = ['day log, plan or summary only','test-by-test data, no scored outcome','scored outcome for every test'];
const RELWHY = ['background science','supporting study','core crew fire-safety study'];

function airTier(inv, h){
  const b = h.box, ts = T.filter(t => t.psi === inv.id && t.o2 != null && t.p != null);
  if(ts.length){
    const hit = ts.filter(t => inBox(t, b)), n = hit.length;
    if(n) return {pts:3, why:`tested in this air (${n} test${n>1?'s':''}${hit.some(t=>t.pnom)?', pressure nominal':''})`};
    const o = ts.map(t => t.o2), p = ts.map(t => t.p);
    if(h.o2 >= Math.min(...o) && h.o2 <= Math.max(...o) && h.p >= Math.min(...p) && h.p <= Math.max(...p)) return {pts:1, why:'inside the tested range, no test close'};
    return {pts:0, why:'outside the conditions tested'};
  }
  if(inv.o2){
    if(!(inv.o2[0] <= b.o2[1] && inv.o2[1] >= b.o2[0])) return {pts:0, why:'outside the conditions tested'};
    if(inv.p) return (inv.p[0] <= b.p[1] && inv.p[1] >= b.p[0]) ? {pts:2, why:"its table's conditions cover this air"} : {pts:1, why:'oxygen matches, pressure does not'};
    return {pts:1, why:'oxygen range covers this air, pressure not recorded'};
  }
  return {pts:0, why:'no oxygen or pressure in its table'};
}
function scoreInv(inv, h){ const a = airTier(inv, h); return {a, d:inv.data, r:inv.rel, total:a.pts + inv.data + inv.rel}; }
const pips = (n, max) => Array.from({length:max}, (_, i) => `<i class="pip${i < n ? ' on' : ''}"></i>`).join('');
function invCard(inv, h){
  const s = scoreInv(inv, h), chk = CHECKED.includes(inv.id);
  return `<article class="inv"><div class="invh"><div><h4>${esc(inv.name)}</h4>${srcChip(inv.id)}${chk ? '<span class="chk">Checked against PSI ✓</span>' : ''}</div>
    <div class="score" title="Air match ${s.a.pts}/3 + data ${s.d}/2 + crew relevance ${s.r}/2"><b>${s.total}</b>/7</div></div>
    <p class="sm"><b>Tested</b> ${esc(inv.t)}</p><p class="sm"><b>Found</b> ${esc(inv.f)}</p>
    <p class="use"><b>Useful for:</b> ${esc(inv.u)}</p>
    <div class="bd"><span>Air match</span><span class="pp">${pips(s.a.pts,3)}</span><span class="nn">${s.a.pts}/3</span><span>Data</span><span class="pp">${pips(s.d,2)}</span><span class="nn">${s.d}/2</span><span>Crew relevance</span><span class="pp">${pips(s.r,2)}</span><span class="nn">${s.r}/2</span></div>
    <p class="why">${esc(s.a.why)} · ${DATAWHY[s.d]} · ${RELWHY[s.r]}</p>
    <a class="plink" href="${psiUrl(inv.id)}" target="_blank" rel="noopener">Open ${inv.id} on PSI</a></article>`;
}
function cardsSection(h){
  const rank = list => list.map(inv => ({inv, s:scoreInv(inv, h)})).sort((a,b) => b.s.total - a.s.total || b.s.r - a.s.r || b.s.d - a.s.d || a.inv.name.localeCompare(b.inv.name));
  const col = ([name, q]) => { const l = rank(INV.filter(i => i.pillar === name)); return `<div class="pcol"><h3>${name}<small>${q} · ${l.length} investigation${l.length>1?'s':''}</small></h3>${l.map(x => invCard(x.inv, h)).join('')}</div>`; };
  const sup = rank(INV.filter(i => i.pillar === 'Supporting'));
  return `<h2>Investigation cards</h2>
  <p class="sub">All ${INV.length} NASA investigations that have experimental tables, best match first for ${esc(h.name)} air (${fmt(h.o2,1)}% O₂, ${fmt(h.p,1)} psi). ${CHECKED.length} of ${INV.length} summaries have been checked against PSI so far; only those carry a ✓ tag.</p>
  <details class="how"><summary>How the score works</summary><p>Score out of 7 = <b>Air match</b> (0–3) + <b>Data</b> (0–2) + <b>Crew relevance</b> (0–2). It is a visible formula, not an AI judgement.</p>
  <ul class="plain"><li><b>Air match:</b> 3 = a test within ±4 points of O₂ and ±1.5 psi; 2 = the table's stated conditions cover this air; 1 = partly (oxygen only, or inside the tested range with no test close); 0 = no match or nothing recorded.</li>
  <li><b>Data:</b> 2 = a scored outcome for every test; 1 = test-by-test data without a scored outcome; 0 = a day log, plan or summary only.</li>
  <li><b>Crew relevance:</b> from the relevance dots in the data guide (3 dots = 2, 2 dots = 1, 1 dot = 0).</li></ul>
  <p>These point values are provisional until Sirin's values and reasons are ready. Pressure for BASS-II and Saffire is nominal.</p></details>
  <div class="pillars">${PILLARS.map(col).join('')}</div>
  <details class="more"><summary>Supporting flame science (${sup.length} investigations)</summary><p class="sub" style="margin-top:8px">Background and indirect studies. They have tables but do not answer a crew fire-safety question on their own.</p><div class="pillars sup">${sup.map(x => invCard(x.inv, h)).join('')}</div></details>`;
}

/* ---------- gap logic ---------- */
function stats(){
  const flame = FLAME, flex = T.filter(t => t.study === 'FLEX'), real = T.filter(t => t.study === 'BASS-II' || t.study === 'Saffire');
  const realO2 = real.filter(t => t.o2 != null);
  const band = (arr,a,b) => arr.filter(t => t.o2 >= a && t.o2 <= b);
  const w = arr => arr.filter(t => t.out === 'went_out').length;
  return { nFlame: flame.length, nFlex: flex.length, nReal: real.length, maxRealO2: Math.max(...realO2.map(t => t.o2)),
    flexLow: band(flex,12,15.99), flexMid: band(flex,21,25.99), flexHigh: band(flex,30,34.99), w, band, flex };
}
const nearest = (h, k=1) => T.filter(t => t.p != null && t.o2 != null).map(t => ({t, d: Math.hypot((t.o2 - h.o2) / 4, (t.p - h.p) / 2)})).sort((a,b) => a.d - b.d).slice(0,k).map(x => x.t);
const stationLike = h => Math.abs(h.o2 - 21) <= 4 && Math.abs(h.p - 14.7) <= 1.5;
const glabel = h => h.gl || (h.g < .005 ? '≈0 g' : h.g > .995 ? '1 g' : h.g.toFixed(2) + ' g');
const baseFuel = t => t.what.replace(/ (droplet|sphere)$/, '').replace(/^\d+% /, '');
const list2 = a => a.length ? a.join(', ') : 'none';

function gapsFor(h){
  const st = stats(), inb = T.filter(t => inBox(t, h.box)), flameIn = inb.filter(isFlame), realIn = inb.filter(t => !isFlame(t));
  const m = mix(flameIn), nF = flameIn.length, zero = h.g < .005, one = h.g > .995, hi = st.maxRealO2;
  const droplet = [...new Set(flameIn.filter(t => t.study === 'FLEX').map(baseFuel))], gas = [...new Set(flameIn.filter(t => t.study === 'CFI-G').map(baseFuel))];
  const g = [];
  // gravity
  if(zero) g.push({k:'Gravity', s:'covered', n:`${st.nFlame} of ${st.nFlame}`, t:`All ${st.nFlame} FLEX and CFI-G flame tests flew in microgravity, which matches this habitat.`, src:['PSI-69','PSI-159']});
  else if(one) g.push({k:'Earth gravity', s:'thin', n:`0 of ${st.nFlame}`, t:`None of the ${st.nFlame} FLEX and CFI-G tests ran at Earth gravity. Earth results appear only as comparison columns: Saffire-II lists an Earth (1 g) burn length for each of its 9 samples.`, src:['PSI-69','PSI-159','PSI-99']});
  else g.push({k:'Partial gravity', s:'missing', n:'0 tests', t:`Partial gravity: missing, microgravity and Earth results are bounds only. NASA suggests E-FIELD (PSI-22) as a stand-in; LUCI and FM2 are future sources.`, src:['PSI-22','PSI-69']});
  // same air, flame tests
  g.push({k:'Same air, flame tests', s: nF === 0 ? 'missing' : nF >= 20 ? 'covered' : 'thin', n:`${nF} test${nF===1?'':'s'}`,
    t: nF ? `FLEX and CFI-G tests within ±4 points of O₂ and ±1.5 psi: ${m.went_out||0} went out, ${m.broke_apart||0} broke apart, ${m.kept_burning||0} kept burning, ${m.no_ignition||0} did not ignite.${(m.went_out||0) === 0 ? ' None went out.' : ''}` : `No FLEX or CFI-G test sits within ±4 points of O₂ and ±1.5 psi of this air.`, src:['PSI-69','PSI-159']});
  // real materials
  g.push({k:'Real materials', s: realIn.length ? 'thin' : 'missing', n: realIn.length ? `${realIn.length} tests` : (h.o2 > hi ? `0 above ${fmt(hi)}%` : '0 tests'),
    t: realIn.length ? `${realIn.length} BASS-II and Saffire tests are near this air (their pressure is nominal). BASS-II outcomes are free text and not scored here, so no outcome colour is shown.`
      : (h.o2 > hi ? `No real fabric or plastic in PSI was burned near this air. The highest oxygen tested is ${fmt(hi)}%, which is ${fmt(h.o2 - hi)} points below this habitat.` : `No real fabric or plastic in PSI was burned near this air.`), src:['PSI-25','PSI-98','PSI-99']});
  // airflow
  g.push({k:'Airflow', s: realIn.length ? 'thin' : 'missing', n: realIn.length ? `${realIn.length} tests` : '0 tests',
    t: realIn.length ? `Airflow tests (BASS-II, Saffire) ran at nominal cabin pressure. BASS-II flow steps are free text and not scored here.` : `No airflow test ran in this air. Airflow tests (BASS-II, Saffire) sit at nominal cabin pressure and at most ${fmt(hi)}% O₂; flame tests elsewhere ran in still air.`, src:['PSI-25','PSI-98']});
  // fuel type
  const nf = new Set([...droplet, ...gas]).size;
  g.push({k:'Fuel type', s: nF ? 'thin' : 'missing', n: `${nf} fuel${nf===1?'':'s'}`,
    t: nF ? `Near this air the tests are droplet flames (${list2(droplet)}) and gas flames (${list2(gas)}). They show how fire behaves, not how a fabric or plastic behaves.` : `No flame test is near this air, so no fuel type is covered.`, src:['PSI-69','PSI-159']});
  // smoke detection (SAME, SAME-R, DAFT)
  const stn = stationLike(h);
  g.push({k:'Smoke detection', s: stn ? 'thin' : 'missing', n:'0 particle results',
    t:`SAME (8 rows), SAME-R (67 runs, 42 aged samples) and DAFT (2 sessions) cover smoke detection, but none records oxygen or pressure and SAME-R has no particle results. ${stn ? 'Smoke made in microgravity differs from Earth smoke, so detectors tuned on Earth may need different signatures.' : 'Nothing shows how smoke behaves in this air.'}`, src:['PSI-102','PSI-101','PSI-47']});
  // ISS research gaps
  if(h.key === 'iss' || (h.key === 'custom' && zero && stn)){
    g.push({k:'Cabin conditions', s:'thin', n:'not in tables', t:`The tables do not record the station's oxygen or pressure for BASS-II and Saffire. This dashboard places them at the nominal 14.7 psi and uses each table's stated oxygen. Those marks carry an asterisk.`, src:['PSI-25','PSI-99']});
    g.push({k:'Electrical wires', s:'missing', n:'0 tests', t:`No table records a burning electrical wire. SAME overheats Teflon and Kapton to make smoke, but none of the 20 tables burns a wire.`, src:['PSI-102']});
    g.push({k:'Extinguishing a solid fire', s:'missing', n:'0 tests', t:`No table records an extinguisher used on a real solid fire. FLEX added CO₂ and helium to the air around droplet flames, and BASS tested a nitrogen puff, but its log table holds no results.`, src:['PSI-69','PSI-26']});
    g.push({k:'Fire inside a crewed module', s:'missing', n:'0 tests', t:`Saffire burned on the Cygnus cargo ship after it left the station, and BASS and BASS-II burned small samples in the glovebox. No table records a fire inside a crewed module.`, src:['PSI-98','PSI-25','PSI-26']});
  }
  if(h.key === 'moon' || (h.key === 'custom' && h.o2 >= 25)) g.push({k:'ACME BRE (text only)', s:'thin', n:'8.2 psi', t:`BRE's record lists 34% O₂ at 8.2 psi. Its table has test days at 34% and 40% O₂ but no pressure, so it is not plotted. Per the guide, its emulated fires kept burning above about 25% O₂.`, src:['PSI-20']});
  return {g, inb, flameIn, realIn, m, nF};
}
function means(h, G){
  const st = stats();
  const rate = arr => arr.length ? Math.round(100 * st.w(arr) / arr.length) : null;
  const trend = `In FLEX, droplet flames went out in ${rate(st.flexLow)}% of tests at 12–15% O₂ (${st.w(st.flexLow)} of ${st.flexLow.length}), ${rate(st.flexMid)}% at 21–25% (${st.w(st.flexMid)} of ${st.flexMid.length}) and ${rate(st.flexHigh)}% at 30–34% (${st.w(st.flexHigh)} of ${st.flexHigh.length}).`;
  const f = G.flameIn.filter(t => t.study === 'FLEX');
  if(h.key === 'moon') return `At Moon-base conditions, none of the ${f.length} FLEX tests ended with the flame going out (${f.filter(t=>t.out==='broke_apart').length} broke apart, ${f.filter(t=>t.out==='kept_burning').length} burned to completion). ${trend} Nobody has burned a real material at this oxygen level, so fabric and plastic behaviour there is unknown, and materials checked in ISS-like air should not be assumed safe at 30%.`;
  if(h.key === 'earth') return `None of the ${st.nFlame} FLEX and CFI-G tests ran at Earth gravity, so Earth's flame data comes from orbit and can only act as a bound. Earth air gives ${fmt(.21*14.7,2)} psi of oxygen to breathe, the same as a Moon base (30% × 10.2 psi ≈ 3.06 psi), so the oxygen share is what changes the fire risk. Compare with Saffire-II's Earth burn lengths.`;
  if(h.key === 'iss') return `The ISS is where PSI's flame data was made: ${G.nF} FLEX and CFI-G tests sit within ±4 points of O₂ and ±1.5 psi of station air. The weak spots are real materials (BASS-II outcomes are free text, and Saffire flew outside the station) and four topics no table covers: burning wires, extinguishing a solid fire, smoke particle results and a fire inside a crewed module.`;
  // custom
  if(G.nF === 0) return `No NASA flame test sits near this habitat, so PSI cannot say how fire behaves in this air. ${h.g > .005 && h.g < .995 ? 'Partial gravity is also missing: microgravity and Earth results are bounds only.' : ''}`.trim();
  const m = G.m;
  return `${G.nF} NASA flame test${G.nF>1?'s':''} sit near this air: ${m.went_out||0} went out, ${m.broke_apart||0} broke apart, ${m.kept_burning||0} kept burning and ${m.no_ignition||0} did not ignite. ${h.g > .005 && h.g < .995 ? 'Partial gravity is missing: microgravity and Earth results are bounds only. ' : ''}${h.o2 > st.maxRealO2 ? `No real material has been burned above ${fmt(st.maxRealO2)}% O₂, so fabric and plastic behaviour here is unknown.` : `Real materials were tested only up to ${fmt(st.maxRealO2)}% O₂, at nominal cabin pressure.`}`;
}

function breathHtml(C){
  const pp = C.o2 / 100 * C.p, earth = .21 * 14.7, r = pp / earth;
  const msg = r >= .9 && r <= 1.1 ? "About the same as Earth's air." : r < .9 ? "Lower than Earth's air. It would need a medical check." : "Higher than Earth's air.";
  return `<div class="breath2"><div><b>Oxygen to breathe: ${fmt(pp,2)} psi</b> <span class="u">(${fmt(C.o2,1)}% × ${fmt(C.p,1)} psi)</span> · Earth: ${fmt(earth,2)} psi · ${Math.round(r*100)}% of Earth. ${msg}</div>
    <div class="meter" role="img" aria-label="${Math.round(r*100)}% of Earth's breathing oxygen"><i style="width:${Math.min(100, r*50)}%"></i><u></u></div>
    <div class="fnote" style="margin-top:4px">Breathing oxygen only (O₂ share × pressure). It is not a safety rating.</div></div>`;
}
function syncSliders(){
  const C = LOC.custom; C.box = boxOf(C);
  $('#s_o2').value = C.o2; $('#s_p').value = C.p; $('#s_g').value = C.g;
  $('#o_o2').textContent = fmt(C.o2,1) + '%'; $('#o_p').textContent = fmt(C.p,1) + ' psi';
  $('#o_g').textContent = C.g < .005 ? '0 g (microgravity)' : C.g > .995 ? '1 g (Earth)' : C.g.toFixed(2) + ' g (Moon: 0.17)';
  $('#breathHost').innerHTML = breathHtml(C);
}
function updateCustom(){
  syncSliders(); fillLoc(); fillDynamic();
  const C = LOC.custom, inView = C.p >= S.dom.x[0] && C.p <= S.dom.x[1] && C.o2 >= S.dom.y[0] && C.o2 <= S.dom.y[1];
  if(S.zoomKey === 'custom' && !inView) zoomTo('custom'); else renderMap();
}
function bindCustom(){
  const C = LOC.custom;
  [['s_o2','o2'],['s_p','p'],['s_g','g']].forEach(([id,k]) => { $('#'+id).oninput = e => { C[k] = +e.target.value; updateCustom(); }; });
  document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { Object.assign(C, PRESETS[b.dataset.preset]); updateCustom(); });
  syncSliders();
}
function gapHtml(L, G){
  const miss = G.g.filter(x => x.s==='missing').length, thin = G.g.filter(x => x.s==='thin').length;
  const breath = L.key === 'moon' ? `Same oxygen to breathe as Earth: 30% × 10.2 psi ≈ 3.06 psi, against 21% × 14.7 psi ≈ 3.09 psi. A higher oxygen share makes materials burn more easily.`
    : L.key === 'custom' ? `Oxygen to breathe here: ${fmt(L.o2/100*L.p,2)} psi, against Earth's 3.09 psi.` : `21% × 14.7 psi ≈ 3.09 psi of oxygen, the same amount to breathe as a Moon base (30% × 10.2 psi ≈ 3.06 psi).`;
  return `<section class="gap" aria-labelledby="gp">
      <div class="gap-head"><div><h2 id="gp">Gap panel: what is known and what is missing</h2><div class="big">${miss ? miss + ' missing' : 'No outright gaps'}${thin ? ', ' + thin + ' thin' : ''}</div></div>
        <div class="conds"><div><b>${fmt(L.o2,1)}%</b>oxygen</div><div><b>${fmt(L.p,1)} psi</b>pressure</div><div><b>${glabel(L)}</b>${L.g < .005 ? 'Microgravity' : L.g > .995 ? 'Earth gravity' : L.key === 'moon' ? 'Lunar gravity' : 'Partial gravity'}</div></div></div>
      <ul class="gap-list">${G.g.map(x => `<li><div class="row1"><span class="badge ${x.s}">${x.s === 'missing' ? 'Missing' : x.s === 'thin' ? 'Thin' : 'Covered'}</span><span class="k">${esc(x.k)}</span></div><div class="num">${esc(x.n)}</div><p class="txt">${esc(x.t)}</p><div style="grid-column:1/3;margin-top:6px">${x.src.map(srcChip).join('')}</div></li>`).join('')}</ul>
      <div class="gap-foot"><span>${breath}</span>${L.key === 'custom' ? '' : `<a class="btn" href="#/home" data-zoomto="${L.key==='moon'?'moon':'earth'}">Show on the Fire Map</a>`}</div>
    </section>`;
}
function warnHtml(L){
  const n = nearest(L,1)[0];
  return `<div class="nonear" role="alert"><b>No NASA test near this habitat.</b> No FLEX, CFI-G, BASS-II or Saffire test sits within ±4 points of O₂ and ±1.5 psi of ${fmt(L.o2,1)}% O₂ and ${fmt(L.p,1)} psi. ${n ? `The closest is ${esc(n.id)} (${fmt(n.o2)}% O₂, ${fmt(n.p)} psi). ` : ''}The gap panel below shows what is missing.</div>`;
}
function fillLoc(){
  const L = LOC[page], G = gapsFor(L);
  $('#warnHost').innerHTML = G.inb.length ? '' : warnHtml(L);
  $('#gapHost').innerHTML = gapHtml(L, G);
  $('#meansHost').innerHTML = `<h2 id="wm">What this means</h2><p>${esc(means(L, G))}</p>`;
  $('#cardsHost').innerHTML = cardsSection(L);
  document.querySelectorAll('[data-zoomto]').forEach(a => a.onclick = () => { S.zoomKey = a.dataset.zoomto; S.dom = {x:[...WHOLE.x], y:[...WHOLE.y]}; setTimeout(() => zoomTo(a.dataset.zoomto), 60); });
}
function pageLoc(key){
  const L = LOC[key], custom = key === 'custom';
  return `<div class="page-head"><h1>${L.name}${L.sub ? ' <span style="font-weight:400;color:var(--ink2);font-size:.6em">' + L.sub + '</span>' : ''}</h1><p>${L.intro}</p></div>
  <div class="grid"><div class="col">
    ${custom ? customControls() + mapCard() : ''}
    <div id="warnHost"></div>
    <div id="gapHost"></div>
    <section class="means" id="meansHost" aria-labelledby="wm"></section>
    <section class="card" id="cardsHost"></section>
    ${filterBar('Filters apply to the chart and list below. The gap panel and cards always count every test.')}
    <section class="card"><h2>Outcome by oxygen level</h2><p class="sub">The outlined bands overlap ${esc(L.name)}'s oxygen range (±4 points of ${fmt(L.o2,1)}% O₂).</p><div id="bands"></div></section>
    <section class="card"><h2>Closest real tests</h2><p class="sub" id="nearSub"></p><div id="table"></div></section>
  </div>
  <aside class="col insp-col"><div class="sticky" id="insp"></div></aside></div>`;
}

function pageSources(){
  return `<div class="page-head"><h1>Sources &amp; cleaning</h1><p>Where every number comes from, what was changed, and what is left out.</p></div>
  <div class="grid"><div class="col">
  <section class="card"><h2>Investigations</h2><p class="sub">20 of NASA's 24 PSI combustion investigations are listed with the tables used. The other 4 are ground studies with no test table (PSI-62, 115, 117, 60). Each ID links to its PSI page.</p>
    <div class="tscroll"><table class="tbl srcgrid"><thead><tr><th>PSI</th><th>Name</th><th>Table</th><th>DOI</th><th>On this dashboard</th></tr></thead><tbody>${DATA.sources.map(s => `<tr><td>${srcChip(s[0])}</td><td>${esc(s[1])}</td><td>${esc(s[3])}</td><td>${s[4] ? `<a href="https://doi.org/${s[4]}" target="_blank" rel="noopener">${s[4]}</a>` : '<span class="nr">on PSI page</span>'}</td><td>${esc(s[5])}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="card"><h2>What was changed in the data</h2>${DATA.log.map(l => `<div class="logitem"><b>${esc(l.psi)}</b> ${esc(l.change)}</div>`).join('')}
    <p class="sub" style="margin-top:10px">Nothing was invented. A missing value is shown as "no value recorded", never as 0. Each test's inspector shows the original CSV row beside the cleaned values.</p></section>
  <section class="card"><h2>How outcomes are grouped</h2><table class="mapdef"><tbody>${Object.entries(OUT).map(([k,o]) => `<tr><td><i class="dotsw" style="background:${o.color}"></i><b>${o.label}</b></td><td>${esc(o.def)}</td></tr>`).join('')}</tbody></table>
    <p class="sub">This grouping is ours, built from the tables' own end codes. The original word is always shown in the inspector.</p></section>
  <section class="card"><h2>AI use</h2><p style="margin:0;font-size:14.5px">${esc(AI_USE)}</p></section>
  <section class="card"><h2>Investigation cards</h2><p style="margin:0;font-size:14.5px">The 20 cards on each place page cover every investigation in the list above. Prevention, Detection and Suppression come from the data guide; the 10 supporting flame-science studies sit in their own folded group. Each card's score is Air match (0–3) + Data (0–2) + Crew relevance (0–2), and the breakdown is shown on the card.</p></section>
  <section class="card"><h2>Assumptions and left out</h2><ul class="plain">
    <li>FLEX pressure is in mmHg in the file and is converted to psi (÷ 51.7149). CFI-G pressure is in bar (× 14.5038).</li>
    <li>The FLEX column headed "CO" is read as carbon dioxide, which the data guide says was added to some atmospheres.</li>
    <li>BASS-II and Saffire have no pressure column; they sit at nominal 14.7 psi cabin pressure, marked with an asterisk.</li>
    <li>Hatched cells use a 2% oxygen × 2 psi grid and count only FLEX and CFI-G normal-flame tests. Other investigations (for example BRE, with no pressure recorded) are not in the shading.</li>
    <li>CFI-G inverse flames are not plotted: their oxygen is in the burner stream, not the room air.</li>
    <li>ACME's day-by-day ignition counts (BRE, s-Flame, CLD, E-FIELD) are not charted. BRE appears only as text on the Moon page.</li>
    <li>PSI page links use the pattern given in the data guide (psi.nasa.gov/physci/repo/data/investigations/PSI-ID). They have not been opened and checked yet.</li></ul></section>
  </div><aside class="col insp-col"><div class="sticky" id="insp"></div></aside></div>`;
}

/* ---------- router ---------- */
let page = 'home';
function csv(list){
  const cols = ['test_id','study','psi_id','psi_table_file','csv_line','id_in_table','oxygen_pct','pressure_psi','pressure_note','outcome_group','outcome_as_recorded'];
  const q = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  return [cols.join(',')].concat(list.map(t => [t.id,t.study,t.psi,t.file,t.row,t.tid,t.o2,t.p,t.pnom?'nominal cabin pressure, not recorded':(t.p==null?'no value recorded':'converted from source'),OUT[t.out].label,t.native].map(q).join(','))).join('\n');
}
function fillDynamic(){
  const list = filtered();
  const b = $('#bands'); if(b) b.innerHTML = bandChart(LOC[page] ? LOC[page].box.o2 : null);
  const tb = $('#table');
  if(tb){
    if(LOC[page]){
      const L = LOC[page];
      const near = list.filter(t => t.p != null && t.o2 != null).map(t => ({t, d: Math.hypot((t.o2 - L.o2) / 4, (t.p - L.p) / 2)})).sort((a,b) => a.d - b.d).slice(0, 12).map(x => x.t);
      tb.innerHTML = near.length ? testTable(near, {limit:12}) : '<p class="sub">No tests match the filters.</p>';
    } else tb.innerHTML = list.length ? testTable(list) : '<p class="sub">No tests match the filters. Use Reset filters.</p>';
    bindTable(tb);
  }
  const ms = $('#mapsub'); if(ms){
    const n = list.filter(t => t.p != null).length, nop = list.filter(t => t.p == null), np = nop.length;
    const who = [...new Set(nop.map(t => t.study))].join('/');
    ms.textContent = `${n} of ${list.length} matching tests shown on the map.` + (np ? ` ${np} ${who} test${np>1?'s have':' has'} no pressure recorded, so ${np>1?'they are':'it is'} in the table but not on the map.` : '') + ' Click a dot or a star.';
  }
  const ns = $('#nearSub'); if(ns && LOC[page]){ const L = LOC[page]; ns.textContent = `The 12 tests nearest to ${fmt(L.o2,1)}% O₂ and ${fmt(L.p,1)} psi, by distance on the Fire Map. Select one to inspect it.`; }
}
function refresh(keepFocus){
  const f = keepFocus && document.activeElement && document.activeElement.id === 'q';
  const pos = f ? document.activeElement.selectionStart : 0;
  // re-render filter chips in place
  document.querySelectorAll('.filters').forEach(el => { const tmp = document.createElement('div'); tmp.innerHTML = filterBar(el.querySelector('.fnote')?.innerHTML || ''); if(keepFocus) { el.querySelectorAll('[data-study],[data-out]').forEach((b,i) => { const nb = tmp.querySelectorAll('[data-study],[data-out]')[i]; b.setAttribute('aria-pressed', nb.getAttribute('aria-pressed')); }); } else el.replaceWith(tmp.firstElementChild); });
  if(!keepFocus) bindFilters(); else bindFilters();
  fillDynamic(); renderMap();
  if(f){ const q = $('#q'); q.focus(); q.setSelectionRange(pos,pos); }
}
function route(){
  const h = (location.hash.replace(/^#\/?/, '') || 'home').split('?')[0];
  page = ['home','earth','iss','moon','custom','sources'].includes(h) ? h : 'home';
  if(page === 'custom'){ S.customOn = true; S.zoomKey = 'custom'; const d = domFor('custom'); S.dom = {x:[...d.x], y:[...d.y]}; }
  document.querySelectorAll('#nav a').forEach(a => a.toggleAttribute('aria-current', a.dataset.p === page) || a.removeAttribute('aria-current'));
  document.querySelectorAll('#nav a').forEach(a => { if(a.dataset.p === page) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const app = $('#app');
  app.innerHTML = page === 'home' ? pageHome() : page === 'sources' ? pageSources() : pageLoc(page);
  document.title = 'Astrolytics · ' + (page === 'home' ? 'Fire Map' : page === 'sources' ? 'Sources & cleaning' : LOC[page].name);
  window.scrollTo(0, 0);
  bindFilters(); renderInspector(); fillDynamic();
  $('#aiFoot').textContent = AI_USE;
  if(LOC[page]) fillLoc();
  if(page === 'custom') bindCustom();
  if(page === 'home' || page === 'custom'){
    renderMap(); bindMapEvents();
    document.querySelectorAll('.mapbar .seg button').forEach(b => b.onclick = () => zoomTo(b.dataset.z));
    $('#dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv(filtered())], {type:'text/csv'})); a.download = 'astrolytics_psi_tests_filtered.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
  }
  if(!S.sel) document.body.classList.remove('has-sel');
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
